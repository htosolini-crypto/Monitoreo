{% extends "base.html" %}
{% from "_form_helpers.html" import render_field %}
{% block title %}{{ titulo }} - Sistema de Gestión y Monitoreo Agronómico{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="h3 fw-bold text-success mb-0">{{ titulo }}</h2>
    <a href="{{ url_for('principios_activos.listar') }}" class="btn btn-outline-secondary">Cancelar</a>
</div>

<div class="card shadow-sm border-0">
    <div class="card-body">
        <form method="POST">
            {{ form.hidden_tag() }}
            <div class="row">
                {{ render_field(form.nombre, 'col-md-6') }}
            </div>
            <button type="submit" class="btn btn-success px-4"><i class="fa-solid fa-floppy-disk me-1"></i> Guardar</button>
        </form>
    </div>
</div>
{% endblock %}
